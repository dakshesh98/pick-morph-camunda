openapi: 3.0.3
info:
  title: WorkflowProject API
  version: 1.0.0
  description: |
    HTTP APIs and Kafka message payloads for the Camunda-based pick instruction workflow system.
servers:
  - url: http://localhost:9191
    description: Local Spring Boot service
paths:
  /Order/pick_instruction:
    post:
      summary: Start pick instruction workflow
      operationId: startPickInstructionWorkflow
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickInstruction'
      responses:
        '200':
          description: Workflow started
          content:
            text/plain:
              schema:
                type: string
  /Order/validate:
    post:
      summary: Send validation result signal
      operationId: sendValidationResult
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationResult'
      responses:
        '200':
          description: Validation signal sent
          content:
            text/plain:
              schema:
                type: string
  /Order/terminate/{pickInstructionId}:
    delete:
      summary: Terminate workflow
      operationId: terminateWorkflow
      tags: [Order]
      parameters:
        - name: pickInstructionId
          in: path
          required: true
          schema:
            type: string
          description: Pick ID used as workflow ID suffix
      responses:
        '200':
          description: Workflow terminated
          content:
            text/plain:
              schema:
                type: string
  /Order/transaction-update:
    post:
      summary: Send transaction update signal
      operationId: sendTransactionUpdate
      tags: [Order]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
      responses:
        '200':
          description: Transaction update signal sent
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    PickInstruction:
      type: object
      description: Pick instruction event — received via Kafka (gor.pick-instruction.events) or REST (POST /Order/pick_instruction)
      properties:
        id:
          type: string
          description: Pick instruction ID — used as WorkflowId and OrderId
        order_id:
          type: string
        orderline_id:
          type: string
        qty:
          type: integer
          format: int32
        slot_id:
          type: string
          description: Inventory location slot
        uom:
          type: string
        tpid:
          type: string
        item_id:
          type: string
        pps_id:
          type: integer
          format: int32
        bin_id:
          type: string
        extra_fields:
          type: object
          properties:
            barcodes:
              type: array
              items:
                type: string
              description: LPN / marked-container barcodes
            product_sku:
              type: string
            seat_name:
              type: string
      required: [id, order_id, orderline_id, qty, slot_id, uom, tpid, item_id, pps_id, bin_id]
    ValidationResult:
      type: object
      properties:
        orderId:
          type: string
          description: Matches PickId
        transactionId:
          type: string
        success:
          type: boolean
      required: [orderId, success]
    TransactionUpdate:
      type: object
      properties:
        pickInstructionId:
          type: string
        transactionId:
          type: string
        command:
          type: string
          description: e.g., UPDATE, CANCEL, COMPLETE, RETRY
        transactionType:
          type: string
          description: e.g., PICK, DROP, SCAN
        processedQty:
          type: integer
          format: int32
        status:
          type: string
          description: e.g., IN_PROGRESS, COMPLETED, FAILED
        timestamp:
          type: string
          description: ISO-8601 timestamp
        additionalInfo:
          type: string
      required: [pickInstructionId, transactionId, command, status]
    OrderUpdateEvent:
      type: object
      description: >
        Published to <tenant>.order_update.events for every AE pick-list event
        (both event_type=update and event_type=pick_transaction).
      properties:
        pick_instruction_id:
          type: string
          description: Internal pick instruction identifier
        transaction_id:
          type: string
          description: Same as pick_instruction_id — the pick instruction identifier
        order_id:
          type: string
          description: Customer order ID from PickInstruction
        orderline_id:
          type: string
          description: Customer orderline ID from PickInstruction
        state:
          type: string
          description: AE order state (e.g. cancellation_locked, pick_transaction, complete)
        sub_state:
          type: string
          description: AE order sub_state (e.g. created, in_palletization, fully_palletized)
        actuals:
          type: object
          description: Per-orderline actuals from the AE pick-list event
      required: [pick_instruction_id, order_id, orderline_id, state]
  # Kafka message descriptions
  x-kafka:
    topics:
      pick-instruction.events:
        direction: inbound
        description: Triggers creation of a new pick instruction workflow. JSON payload matches PickInstruction schema.
        payload:
          $ref: '#/components/schemas/PickInstruction'
      transaction-updates-topic:
        direction: inbound
        description: Transaction updates consumed by TransactionUpdateListener.
        payload:
          $ref: '#/components/schemas/TransactionUpdate'
      validation-results-topic:
        direction: inbound
        description: Validation results consumed by ValidationResultListener.
        payload:
          $ref: '#/components/schemas/ValidationResult'
      order_update.events:
        direction: outbound
        description: >
          Published for every AE pick-list event (update and pick_transaction).
          Consumed by Butler Core to call make_and_send_order_related_notifications.
        payload:
          $ref: '#/components/schemas/OrderUpdateEvent'
