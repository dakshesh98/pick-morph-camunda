spring.application.name=spring-camunda

server.port=9191
debug=true

# Kafka Bootstrap Servers (supports Docker env override)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Default consumer group (overridden per-listener in @KafkaListener)
spring.kafka.consumer.group-id=pick-workflow-consumer-group
# Default key and value serializers/deserializers for convenience
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Database (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vijay.j}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# Camunda BPM
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.job-execution.enabled=true
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.filter.create=All Tasks

# Butler Core gRPC configuration
butler.core.grpc.address=${BUTLER_GRPC_ADDR:gmc_butler_server:9090}
butler.core.grpc.timeout-seconds=${BUTLER_CORE_GRPC_TIMEOUT:30}
# Mock mode - set to false when real Butler Core is available
butler.core.grpc.mock-enabled=${BUTLER_CORE_MOCK_ENABLED:true}

# Actuator for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Rate limiting (per-IP fixed-window)
# Maximum requests per window (default 100)
ratelimit.requests=100
# Window size in seconds (default 60)
ratelimit.windowSeconds=60

# Rate limit backend: 'nginx' (recommended) or 'java' to enable in-app limiter
ratelimit.backend=nginx

# AE-AA Kafka topic configuration
kafka.tenant.prefix=${KAFKA_TENANT_PREFIX:gor}
kafka.topic.pick-list-requests=${kafka.tenant.prefix}.pick-list.requests
kafka.topic.pick-list-response=${kafka.tenant.prefix}.pick-list.response
kafka.topic.pick-list-events=${kafka.tenant.prefix}.pick-list.events
# BREAKING CHANGE: renamed from item-picked-events to item_picked.events (underscores per AE contract)
# Coordinate with Butler Core before deploying — consumer must update topic name
kafka.topic.item-picked-events=${kafka.tenant.prefix}.item_picked.events
# Step 1: AA receives pick instructions via Kafka (primary trigger; REST kept for backward compat)
kafka.topic.pick-instructions=${kafka.tenant.prefix}.pick-instruction.events
